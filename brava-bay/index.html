<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Brava Bay</title>
<style>
/* Base shell. The UI module (src/ui/) owns the full design; keep the ids used by main.js:
   #gl (canvas), #loading, #load-bar, #load-msg, #ui (HUD/menu root). */
:root {
	--bg: #07060c;
	--text: #fff7ef;
	--muted: #c9b9b0;
	--sun: #ff8a3d;
	--rose: #ff4f7b;
	--sea: #2fd3c6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
canvas#gl { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }
#loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
	background: radial-gradient(ellipse at 50% 120%, #ff8a3d 0%, #c2306b 28%, #3a1446 55%, #07060c 85%); }
#loading .logo { font-size: clamp(42px, 9vw, 96px); font-weight: 900; letter-spacing: 0.18em; padding-left: 0.18em; color: #fff; text-shadow: 0 6px 40px rgba(255, 120, 80, .45); }
#loading .tag { color: rgba(255, 240, 230, .75); letter-spacing: .4em; font-size: 12px; text-transform: uppercase; }
#load-track { width: min(420px, 80vw); height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
#load-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--sun), var(--rose)); transition: width .25s; }
#load-msg { color: rgba(255, 240, 230, .8); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="loading">
	<div class="logo">BRAVA BAY</div>
	<div class="tag">An open-world crime sandbox</div>
	<div id="load-track"><div id="load-bar"></div></div>
	<div id="load-msg">Loading…</div>
</div>
